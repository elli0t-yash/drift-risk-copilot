apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: drift-risk-copilot
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: gcr.io/PROJECT_ID/drift-risk-copilot:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: drift-gemini-key
                  key: latest
  traffic:
    - latestRevision: true
      percent: 100
